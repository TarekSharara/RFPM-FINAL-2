<style>
/* Layout: field card + step panel side by side; results card, rule cards and source note full width below. */
:root{
  --bg:#EEF0F3; --panel:#FFFFFF; --panel2:#F6F7F9; --ink:#1B2230; --muted:#5E6878; --line:#DADFE6;
  --accent:#E0613A; --accent-ink:#FFFFFF; --navy:#1F3A68; --navy-ink:#FFFFFF;
  --field:#3D69B0; --field2:#33599A; --fp:#1F3A68; --wait:#F2C4AE; --ammo:#D9E4F2; --ammo-ink:#1F3A68; --target:#FFFFFF;
  --hit:#2FB463; --miss:#D93B36; --good:#1E8E4E; --bad:#C2332E; --warn:#B86A00;
  --f-body:"IBM Plex Sans Arabic", "SF Arabic", "Geeza Pro", "Noto Sans Arabic", Arial, "Segoe UI", sans-serif;
  --f-disp:"Reem Kufi", "IBM Plex Sans Arabic", "SF Arabic", "Geeza Pro", "Noto Sans Arabic", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, "Roboto Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F141C; --panel:#171E2A; --panel2:#1D2533; --ink:#E7ECF3; --muted:#9AA6B6; --line:#2A3445;
  --accent:#F07A52; --accent-ink:#1A0D07; --navy:#22457E; --navy-ink:#FFFFFF;
  --field:#2C4F88; --field2:#25446F; --fp:#152B4E; --wait:#D9A08A; --ammo:#B9CBE3; --ammo-ink:#132B52; --target:#F1F4F8;
  --hit:#3CCB75; --miss:#FF6A63; --good:#49C27E; --bad:#FF6A63; --warn:#E5A23A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F141C; --panel:#171E2A; --panel2:#1D2533; --ink:#E7ECF3; --muted:#9AA6B6; --line:#2A3445;
  --accent:#F07A52; --accent-ink:#1A0D07; --navy:#22457E; --navy-ink:#FFFFFF;
  --field:#2C4F88; --field2:#25446F; --fp:#152B4E; --wait:#D9A08A; --ammo:#B9CBE3; --ammo-ink:#132B52; --target:#F1F4F8;
  --hit:#3CCB75; --miss:#FF6A63; --good:#49C27E; --bad:#FF6A63; --warn:#E5A23A; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:18px 36px}
.wrap{max-width:1240px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
button,select,input{font:inherit; color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.hdr{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:flex-start}
.eyebrow{font-size:13px; color:var(--muted); margin:0}
h1{font-family:var(--f-disp); font-weight:700; font-size:clamp(28px,4vw,42px); line-height:1.15; margin:2px 0 4px; text-wrap:balance}
.lead{margin:0; color:var(--muted); max-width:62ch}
.hdr-side{display:flex; flex-direction:column; gap:10px; align-items:flex-end}
.langbtn{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 16px; font-weight:700; cursor:pointer}
.phasechips{display:flex; gap:6px; flex-wrap:wrap}
.pchip{border:1px solid var(--line); background:var(--panel); color:var(--muted); border-radius:999px; padding:4px 12px; font-size:13px; cursor:pointer}
.pchip[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
nav.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line)}
nav.tabs button{border:0; background:none; padding:9px 14px; color:var(--muted); cursor:pointer; border-bottom:3px solid transparent; font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:700}
.main{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:16px; align-items:start}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
.col{display:flex; flex-direction:column; gap:16px; min-width:0}
.card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; min-width:0}
.card h2{font-family:var(--f-disp); font-size:18px; margin:0 0 8px; font-weight:700}
.fieldcard{padding:10px}
#field{display:block; width:100%; height:auto; border-radius:10px}
.tok{transition:transform .8s cubic-bezier(.4,.1,.2,1), opacity .4s}
@media (prefers-reduced-motion:reduce){.tok{transition:none}}
.timer{display:flex; align-items:center; gap:10px; padding:8px 6px 2px; font-size:13px; color:var(--muted)}
.timer .t{font-family:var(--f-mono); font-weight:600; color:var(--ink); min-width:4.2ch; direction:ltr}
.timer .bar{flex:1; height:8px; border-radius:6px; background:var(--panel2); border:1px solid var(--line); overflow:hidden}
.timer .bar i{display:block; height:100%; width:0; background:var(--hit)}
.legend{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:12.5px; color:var(--muted); padding:6px}
.legend span{display:inline-flex; gap:6px; align-items:center}
.sw{width:12px; height:12px; border-radius:3px; display:inline-block}
.sw.c{border-radius:50%}
.stephead{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
.tag{font-family:var(--f-mono); font-size:11.5px; border:1px dashed var(--line); padding:2px 8px; border-radius:6px; color:var(--muted)}
.steptitle{font-family:var(--f-disp); font-size:22px; font-weight:700; margin:6px 0 10px; line-height:1.35}
.cmdbox{background:var(--navy); color:var(--navy-ink); border-radius:10px; padding:10px 14px; margin-bottom:10px}
.cmdbox .cap{font-size:12px; opacity:.8; margin-bottom:4px}
.cmdrow.rep{opacity:.55}
.cmdrow.rep.now{opacity:1; background:var(--accent); color:var(--accent-ink); border-radius:8px; padding:6px 8px; margin:2px -8px 0}
.cmdrow{display:grid; grid-template-columns:1fr auto; gap:2px 12px; padding:5px 0; border-top:1px solid rgba(255,255,255,.12)}
.cmdrow:first-of-type{border-top:0}
.cmdrow .c{font-family:var(--f-mono); font-weight:600; font-size:14px; direction:ltr; text-align:start; overflow-wrap:anywhere}
body[dir="rtl"] .cmdrow .c{text-align:right}
.cmdrow .at{font-family:var(--f-mono); font-size:12.5px; opacity:.85; direction:ltr}
.desc{margin:0 0 10px}
.chip{display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; font-size:12px; font-weight:700; border:1px solid rgba(0,0,0,.25); vertical-align:-5px; font-family:var(--f-mono)}
.ref{font-size:12px; color:var(--muted); font-family:var(--f-mono)}
.trainbtn{width:100%; border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:9px 12px; cursor:pointer; font-weight:700}
.trainbtn:hover{border-color:var(--accent)}
.trainer{border:1.5px solid #7FA6E0; border-radius:12px; padding:14px; margin-top:10px; background:var(--panel)}
.trainer[hidden]{display:none!important}
.trow{display:flex; justify-content:space-between; align-items:center; gap:10px}
.tcount{font-family:var(--f-mono); font-weight:600; font-size:30px; line-height:1; direction:ltr}
.tstage{display:flex; align-items:center; gap:8px; font-weight:700}
.tdot{width:16px; height:16px; border-radius:50%; background:var(--line)}
.tdot.red{background:var(--miss)} .tdot.green{background:var(--hit)}
.saybox{background:var(--navy); color:var(--navy-ink); border-radius:10px; padding:10px 14px; margin:10px 0 6px; transition:background .2s}
.saybox.now{background:var(--accent); color:var(--accent-ink)}
.saybox.idle{background:color-mix(in srgb, var(--navy) 55%, var(--panel))}
.saybox .cap{font-size:12px; opacity:.85}
.saybox .say{font-family:var(--f-mono); font-weight:600; font-size:clamp(16px,2vw,20px); direction:ltr; text-align:start; overflow-wrap:anywhere; min-height:1.4em}
body[dir="rtl"] .saybox .say{text-align:right}
.thint{font-size:12.5px; color:var(--muted); margin:0 0 10px}
.tbtns{display:flex; gap:8px; flex-wrap:wrap}
.checks{display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:13px}
.checks label{display:inline-flex; gap:6px; align-items:center; cursor:pointer}
.ctrls{display:flex; flex-direction:column; gap:12px}
.navrow{display:grid; grid-template-columns:auto auto 1fr auto auto; gap:8px}
.navrow .btn{white-space:nowrap}
#bstart .bt,#bplay .bt,#bpause .bt{display:none}
#bstart,#bplay,#bpause{min-width:48px; font-size:17px}
#pensnd[aria-pressed="false"]{color:var(--muted); border-style:dashed}
#bpause[aria-pressed="true"]{background:var(--navy); border-color:var(--navy); color:var(--navy-ink)}
.btn{border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:9px 14px; cursor:pointer; font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
input[type="range"]{width:100%; accent-color:var(--accent)}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.seg button{border:0; background:var(--panel); padding:4px 10px; cursor:pointer; font-family:var(--f-mono); font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
select, input[type="text"]{border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:7px 9px; min-width:0}
.grow{flex:1; min-width:0}
.small{font-size:12.5px; color:var(--muted)}
details summary{cursor:pointer; font-weight:700}
.names{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:4px}
.names label{display:flex; gap:6px; align-items:center}
.names .noc{flex:0 0 64px; width:64px; text-transform:uppercase; text-align:center; font-family:var(--f-mono)}
.toggle{display:flex; gap:10px; align-items:center; font-weight:700; cursor:pointer; min-height:44px}
.toggle input{width:22px; height:22px}
#namespaste{width:100%; margin-top:10px; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:8px; font:inherit; font-size:16px; resize:vertical; unicode-bidi:plaintext; text-align:start}
.namesopt{border-top:1px solid var(--line); padding-top:6px}
.names input{width:100%}
.gate{border:1.5px solid var(--accent); border-radius:12px; padding:12px; margin-top:10px; background:color-mix(in srgb, var(--accent) 6%, var(--panel))}
.gate[hidden]{display:none!important}
.gate h3{margin:0 0 8px; font-size:15px}
.opts{display:flex; flex-direction:column; gap:6px}
.opt{text-align:start; border:1px solid var(--line); background:var(--panel); border-radius:9px; padding:8px 11px; cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good); background:color-mix(in srgb, var(--good) 14%, var(--panel))}
.opt.wrong{border-color:var(--bad); background:color-mix(in srgb, var(--bad) 12%, var(--panel))}
.tw{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums}
th{font-size:12px; color:var(--muted); font-weight:500; padding:6px; border-bottom:1px solid var(--line); text-align:start; white-space:nowrap}
td{padding:6px; border-bottom:1px solid var(--line); white-space:nowrap}
tr.shoot td{background:color-mix(in srgb, var(--accent) 12%, transparent)}
tr.out td{color:var(--muted)}
#results tr.elim td{background:color-mix(in srgb,var(--miss) 13%,var(--panel)); color:var(--muted)}
#results tr.elim td:first-child{box-shadow:inset 4px 0 0 var(--miss)}
#results tr.mg td{background:color-mix(in srgb,#E8B923 26%,var(--panel)); color:var(--ink)}
#results tr.ms td{background:color-mix(in srgb,#9AA4AE 26%,var(--panel)); color:var(--ink)}
#results tr.mb td{background:color-mix(in srgb,#C27C3A 24%,var(--panel)); color:var(--ink)}
@keyframes tieblink{0%,100%{background:var(--panel)}50%{background:#FFD84D}}
#results tr.tie td,#board tr.tie td{animation:tieblink 1s ease-in-out infinite; font-weight:700}
#results tr.tie.short td,#board tr.tie.short td{animation-iteration-count:4}
.dots{display:inline-flex; gap:3px; direction:ltr}
.dots i{width:10px; height:10px; border-radius:50%; border:1.5px solid var(--line); display:inline-block}
.dots i.h{background:var(--hit); border-color:var(--hit)}
.dots i.m{border-color:var(--miss)}
.pill{display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:999px; padding:1px 9px}
.pill.shoot{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.pill.g{border-color:#C9A227; color:#9A7A0E} .pill.s{border-color:#8E99A6} .pill.b{border-color:#B57A44; color:#9A5E2A}
.pill.out{color:var(--muted)}
.tot{font-weight:700}
.rescard td,.rescard th{text-align:center}
.rescard td:first-child,.rescard th:first-child{text-align:start}
.cur{background:color-mix(in srgb, var(--accent) 10%, transparent)}
.infos{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px}
.info h3{font-family:var(--f-disp); font-size:17px; margin:0 0 6px}
.info p{margin:0; font-size:13.5px; color:var(--muted)}
.src{font-size:12.5px; color:var(--muted); margin:0}
.langbtn[aria-pressed="false"]{color:var(--muted); border-style:dashed}
.byline{margin:6px 0 0; font-size:13px; font-weight:700; color:var(--accent); letter-spacing:.02em}
.byline-foot{font-weight:700}
.designer{white-space:pre-line; margin:2px 0 0; font-size:12.5px; color:var(--muted)}
.pencard{max-width:1000px; margin:0 auto; width:100%}
.penbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:4px 0 12px}
.penbar input{flex:1 1 220px; font-size:16px}
.pengrp{margin-top:14px}
.pengrp h3{font-family:var(--f-disp); font-size:16px; margin:0 0 6px; color:var(--muted)}
.pen{padding:4px 0}
.penq{display:flex; width:100%; align-items:center; gap:10px; text-align:start; border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:10px 12px; cursor:pointer; font-weight:700; min-height:48px}
.penq:hover{border-color:var(--accent)}
.penq .pn{flex:0 0 auto; font-family:var(--f-mono); font-size:12px; color:var(--muted); min-width:2.2ch}
.penq .px{flex:1; min-width:0}
.penq .chev{flex:0 0 auto; font-size:13px; color:var(--muted); transition:transform .2s}
.penq[aria-expanded="true"]{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 7%, var(--panel))}
.penq[aria-expanded="true"] .chev{transform:rotate(180deg)}
.pena{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 14px; align-items:start; padding:10px 12px 6px}
.pena .pp{font-size:14.5px}
.pena .pr{font-family:var(--f-mono); font-size:12.5px; font-weight:600; color:var(--navy); direction:ltr; white-space:nowrap; text-align:end}
.pena .say{grid-column:1/-1; justify-self:start; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:4px 12px; cursor:pointer; font-size:13px; min-height:36px}
.pena .say:hover{border-color:var(--accent)}

/* ================= scenario plans ================= */
const rnd=p=>Math.random()<p;
function makePlan(){
  const p={hits:{},so:{}};
  for(let n=1;n<=8;n++){
    const prob=0.82-(n-1)*0.012;
    p.hits[n]=[]; for(let s=0;s<=8;s++){const h=[];for(let k=0;k<5;k++)h.push(rnd(prob));p.hits[n].push(h);}
    p.so[n]=[]; for(let r=0;r<12;r++){const h=[];for(let k=0;k<5;k++)h.push(rnd(prob));p.so[n].push(h);}
  }
  return p;
}
function planFor(kind){
  for(let i=0;i<6000;i++){
    const p=makePlan(); const ev=simulate(p,NAMES,true).events;
    if(kind===0 && !ev.length) return p;
    if(kind===1 && ev.some(e=>e.t==="t85")) return p;
    if(kind===2 && ev.some(e=>e.t==="so"&&e.place===4)) return p;
    if(kind===3 && ev.some(e=>e.t==="so"&&e.place===3)) return p;
    if(kind===4 && ev.some(e=>e.t==="so"&&e.place===1)) return p;
  }
  return makePlan();
}

let PENF=-1, PENQ="", PENALL=false; const PENOPEN=new Set();
const PBSAY={hit1:"one hit deducted",hit2:"two hits deducted",first2:"two hits deducted from the first two hits",dsq:"disqualification",maydsq:"possible disqualification",dns:"did not start, D N S",none:"no penalty",rpt:"the series is repeated",ok:"the displayed hits count",no:"not permitted",info:"deduction rule"};
function penSpeech(it){
  const rule=it.r.replace(/\s*·\s*/g,lang==="ar"?"، ":", ");
  const badge=lang==="ar"?L(PB[it.k]):PBSAY[it.k];
  return `${L(it.x)}. ${badge}. ${L(it.p)} ${t().penRule} ${rule}.`;
}
let PENSND=true; try{ PENSND=localStorage.getItem("rfpm2-pensound")!=="0"; }catch(e){}
function sayPen(it){
  if(!synth||!PENSND) return;
  speak(penSpeech(it),true);
}
function renderPen(){
  const tt=t();
  $("tab-pen").textContent=tt.tabPen; $("penh").textContent=tt.penh; $("pensub").textContent=tt.pensub;
  $("pensearch").placeholder=tt.penSearch; $("pensearch").setAttribute("aria-label",tt.penSearch); $("pennote").textContent=tt.penTap+" "+tt.pennote;
  $("pensnd").textContent=PENSND?tt.penSnd1:tt.penSnd0; $("pensnd").setAttribute("aria-pressed",PENSND); $("pensnd").hidden=!synth; $("penall").textContent=PENALL?tt.penHide:tt.penShow; $("penall").setAttribute("aria-pressed",PENALL);
  const ch=$("penchips"); ch.innerHTML="";
  [{g:{ar:tt.penAll,en:tt.penAll}},...PEN].forEach((grp,k)=>{const b=document.createElement("button"); b.className="pchip"; b.textContent=L(grp.g); b.setAttribute("aria-pressed",PENF===k-1); b.onclick=()=>{PENF=k-1; renderPen();}; ch.appendChild(b);});
  const q=PENQ.trim().toLowerCase(); const box=$("penlist"); box.innerHTML=""; let n=0, num=0;
  PEN.forEach((grp,gi)=>{
    const all=grp.items.map((it,ii)=>({it,key:gi+"-"+ii,no:++num}));
    if(PENF>=0&&PENF!==gi) return;
    const its=all.filter(({it})=>!q||[L(it.x),it.x.en,it.r].concat(PENALL?[L(it.p),it.p.en,L(PB[it.k])]:[]).join(" ").toLowerCase().includes(q));
    if(!its.length) return; n+=its.length;
    const g=document.createElement("div"); g.className="pengrp"; g.innerHTML=`<h3>${esc(L(grp.g))}</h3>`;
    its.forEach(({it,key,no})=>{
      const open=PENALL||PENOPEN.has(key);
      const row=document.createElement("div"); row.className="pen";
      row.innerHTML=`<button class="penq" aria-expanded="${open}" aria-controls="pa-${key}"><span class="pn">${no}</span><span class="px">${esc(L(it.x))}</span><span class="chev" aria-hidden="true">▾</span></button>
        <div class="pena" id="pa-${key}" ${open?"":"hidden"}><div class="pp"><span class="pb ${it.k}">${esc(L(PB[it.k]))}</span><br>${esc(L(it.p))}</div><div class="pr">ISSF ${esc(it.r)}</div>${synth&&PENSND?`<button class="say">${esc(tt.penSay)}</button>`:""}</div>`;
      const q1=row.querySelector(".penq"), a=row.querySelector(".pena");
      q1.onclick=()=>{
        const isOpen=q1.getAttribute("aria-expanded")==="true";
        if(isOpen){ q1.setAttribute("aria-expanded","false"); a.hidden=true; PENOPEN.delete(key); try{synth&&synth.cancel()}catch(e){} }
        else { q1.setAttribute("aria-expanded","true"); a.hidden=false; PENOPEN.add(key); sayPen(it); }
      };
      const sb=row.querySelector(".say"); if(sb) sb.onclick=()=>sayPen(it);
      g.appendChild(row);
    });
    box.appendChild(g);
  });
  if(!n) box.innerHTML=`<p class="penempty">${esc(tt.penNone)}</p>`;
}
$("pensnd").onclick=()=>{ PENSND=!PENSND; try{localStorage.setItem("rfpm2-pensound",PENSND?"1":"0")}catch(e){} if(!PENSND){ try{synth&&synth.cancel()}catch(e){} } renderPen(); };
$("penall").onclick=()=>{ PENALL=!PENALL; if(!PENALL) PENOPEN.clear(); try{synth&&synth.cancel()}catch(e){} renderPen(); };
$("pensearch").oninput=e=>{PENQ=e.target.value; renderPen();};

let CI=0, CANS={}; const CORD={};
function caseOrder(i){ if(!CORD[i]){ const a=CASES[i].o.map((_,k)=>k); for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1)); [a[j],a[r]]=[a[r],a[j]];} CORD[i]=a; } return CORD[i]; }
function renderCase(){
  const tt=t(), c=CASES[CI];
  $("caseno").innerHTML=`${tt.caseNo} <b>${CI+1}</b> ${tt.of} ${CASES.length}`; $("casetag").textContent=tt.caseTag;
  $("casetitle").textContent=L(c.h); $("casetext").textContent=L(c.x); $("caseq").textContent=L(c.q);
  $("caseshots").innerHTML=c.shots?[...c.shots].map((s,k)=>`<span class="shot"><b class="${s}"></b>${k+1}</span>`).join(""):"";
  const box=$("caseopts"); box.innerHTML=""; const ans=CANS[CI];
  caseOrder(CI).forEach((k,pos)=>{const o=c.o[k]; const b=document.createElement("button");b.className="opt";b.textContent=(pos+1)+". "+L(o);
    if(ans!=null){b.disabled=true; if(k===c.a)b.classList.add("right"); else if(k===ans)b.classList.add("wrong");}
    b.onclick=()=>{CANS[CI]=k;renderCase();}; box.appendChild(b);});
  $("caseex").innerHTML=ans!=null?`<b>${ans===c.a?tt.right:(lang==="ar"?"ليست الإجابة الصحيحة.":"Not quite.")}</b> ${esc(L(c.e))} <span class="ref">ISSF ${c.r}</span>`:"";
  $("cprev").textContent=tt.cprev; $("cnext").textContent=tt.cnext; $("crestart").textContent=tt.crestart; $("clisten").textContent=tt.clisten;
  $("cprev").disabled=CI===0; $("cnext").disabled=CI===CASES.length-1; $("clisten").disabled=!synth;
  const right=Object.entries(CANS).filter(([i,a])=>CASES[i].a===a).length;
  $("cscore").textContent=`${tt.cscore} ${right} / ${Object.keys(CANS).length}`;
}
$("cprev").onclick=()=>{CI--;renderCase()}; $("cnext").onclick=()=>{CI++;renderCase()};
$("crestart").onclick=()=>{CI=0;CANS={};for(const k in CORD)delete CORD[k];renderCase()};
$("clisten").onclick=()=>{ if(!SOUND){ SOUND=true; try{localStorage.setItem("rfpm2-sound","1")}catch(e){} render(false); renderCase(); } const c=CASES[CI]; speak(L(c.h)+". "+L(c.x)+" "+L(c.q)+" "+caseOrder(CI).map((k,pos)=>(pos+1)+": "+L(c.o[k])).join(". "));};

function setTab(k){ ["sim","cases","pen"].forEach(x=>{ $("tab-"+x).setAttribute("aria-selected",k===x); $("view-"+x).hidden=k!==x; }); if(k!=="sim"){stopPlay();closeTrainer();} try{synth&&synth.cancel()}catch(e){} if(k==="cases") renderCase(); if(k==="pen") renderPen(); }
$("tab-sim").onclick=()=>setTab("sim"); $("tab-cases").onclick=()=>setTab("cases"); $("tab-pen").onclick=()=>setTab("pen");
$("langbtn").onclick=()=>{ lang=lang==="ar"?"en":"ar"; try{localStorage.setItem("rfpm2-lang",lang)}catch(e){} render(false); renderCase(); renderNames(); renderPen(); };
$("bnext").onclick=()=>{stopPlay(); nextStep();};
$("bprev").onclick=()=>{stopPlay(); $("gate").hidden=true; go(I-1,false);};
$("bplay").onclick=play; $("bpause").onclick=pauseAll;
$("seek").oninput=e=>{stopPlay(); $("gate").hidden=true; go(+e.target.value,false);};
$("sp1").onclick=()=>{SPEED=1;render(false)}; $("sp2").onclick=()=>{SPEED=2;render(false)};
$("scen").onchange=e=>newScenario(+e.target.value);
function restart(){ if(PAUSE.on) clearPause(); stopPlay(); closeTrainer(); $("gate").hidden=true; GATE_OK=false; try{synth&&synth.cancel()}catch(e){} go(0,false); }
$("bstart").onclick=restart;
$("vmode").onchange=()=>speakStep(); $("vvoice").onchange=e=>{ VOICE_PREF=e.target.value; try{localStorage.setItem("rfpm2-voice",VOICE_PREF)}catch(x){} speak("ATTENTION"); }; $("vrate").onchange=()=>speakStep();
function applyNames(){ computeNames(); saveNames(); rebuild(true); render(false); }

  $("usenames").checked=USE_NAMES; $("usenamesl").textContent=tt.usenames; $("namespanel").hidden=!USE_NAMES;
  $("nameshelp").textContent=tt.nameshelp; $("namespaste").placeholder=tt.pasteph; $("bfill").textContent=tt.fill; $("bclear").textContent=tt.clearn;
  for(let n=1;n<=8;n++){const l=document.createElement("label"); l.innerHTML=`<span class="chip" style="background:${COLORS[n]};color:${INK[n]}">${n}</span>`;
    const i=document.createElement("input"); i.type="text"; i.id="nm"+n; i.value=ENTRIES[n-1].name; i.maxLength=24; i.placeholder=tt.famph+" "+n; i.setAttribute("aria-label",tt.famph+" "+n); i.autocomplete="off";
    i.oninput=()=>{ENTRIES[n-1].name=i.value;}; i.onchange=()=>{ENTRIES[n-1].name=i.value.trim(); applyNames();};
    const c=document.createElement("input"); c.type="text"; c.className="noc"; c.id="noc"+n; c.value=ENTRIES[n-1].noc; c.maxLength=3; c.placeholder=tt.nocph; c.setAttribute("aria-label",tt.nocph+" "+n); c.autocomplete="off";
    c.onchange=()=>{ENTRIES[n-1].noc=c.value.trim().toUpperCase().slice(0,3); c.value=ENTRIES[n-1].noc; applyNames();};
    l.appendChild(i); l.appendChild(c); box.appendChild(l);} }
$("usenames").onchange=e=>{ USE_NAMES=e.target.checked; $("namespanel").hidden=!USE_NAMES; applyNames(); };
$("bfill").onclick=()=>{ const lines=$("namespaste").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,8);
  lines.forEach((ln,k)=>{ let parts=ln.replace(/^\d+[\.\)\-:]?\s*/,"").split(/[,;\t]+|\s+/).filter(Boolean); let noc="";
    if(parts.length>1&&/^[A-Z]{3}$/.test(parts[parts.length-1])){ noc=parts.pop(); }
    ENTRIES[k]={name:parts.join(" ").slice(0,24),noc:noc}; });
  if(lines.length){ USE_NAMES=true; $("namespaste").value=""; renderNames(); applyNames(); } };
$("bclear").onclick=()=>{ ENTRIES=Array.from({length:8},()=>({name:"",noc:""})); renderNames(); applyNames(); };

/* ================= save for offline ================= */
let DL_DONE=false;
const DL_NAME="RFPM-Final-Simulator-offline.html";
async function saveOffline(){
  const blob=new Blob([SRC],{type:"text/html;charset=utf-8"});
  const done=()=>{ DL_DONE=true; render(false); setTimeout(()=>{DL_DONE=false; render(false);},6000); };
  // Phones/tablets: the share sheet lets the user "Save to Files" / "Save to device"
  const touch=matchMedia("(hover:none)").matches;
  if(touch && navigator.canShare){
    try{ const f=new File([blob],DL_NAME,{type:"text/html"});
      if(navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:"RFPM Final Simulator"}); done(); return; } }
    catch(e){ if(e&&e.name==="AbortError") return; }
  }
  try{ const url=URL.createObjectURL(blob); const a=document.createElement("a");
    a.href=url; a.download=DL_NAME; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); done(); }
  catch(e){ window.open(URL.createObjectURL(blob),"_blank"); }
}
$("dlbtn").onclick=saveOffline;
const FS_OK=!!(document.documentElement.requestFullscreen&&document.fullscreenEnabled!==false);
if(FS_OK) $("fsbtn").hidden=false;
function toggleFS(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){} }
$("fsbtn").onclick=toggleFS;
function toggleSound(){ SOUND=!SOUND; try{localStorage.setItem("rfpm2-sound",SOUND?"1":"0")}catch(e){}
  if(!SOUND){ VOICE_ON=false; try{synth&&synth.cancel()}catch(e){} }
  else { VOICE_ON=true; beep(880,.08); if(!$("view-cases").hidden){ const c=CASES[CI]; speak(L(c.h)+". "+L(c.x)+" "+L(c.q)); } else speakStep(); }
  render(false); renderCase(); }
$("sndbtn").onclick=toggleSound;
document.addEventListener("fullscreenchange",()=>{ $("fsbtn").textContent=document.fullscreenElement?t().fsx:t().fs; setTimeout(()=>renderField(false),120); });
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const tg=e.target; if(tg&&(/^(INPUT|SELECT|TEXTAREA)$/.test(tg.tagName)||tg.isContentEditable)) return;
  if(!$("view-sim").hidden){
    const fwd=lang==="ar"?"ArrowLeft":"ArrowRight", back=lang==="ar"?"ArrowRight":"ArrowLeft";
    if(e.key===fwd||e.key==="PageDown"||e.key==="n"||e.key==="N"){ e.preventDefault(); if(!$("gate").hidden) return; stopPlay(); nextStep(); return; }
    if(e.key===back||e.key==="PageUp"||e.key==="p"||e.key==="P"){ e.preventDefault(); stopPlay(); $("gate").hidden=true; go(I-1,false); return; }
    if(e.key===" "&&!(tg&&tg.tagName==="BUTTON")){ e.preventDefault(); play(); render(false); return; }
    if(e.key==="k"||e.key==="K"){ e.preventDefault(); pauseAll(); return; }
    if(e.key==="t"||e.key==="T"){ e.preventDefault(); TR?closeTrainer():openTrainer(); return; }
    if(e.key==="Home"||e.key==="r"||e.key==="R"){ e.preventDefault(); restart(); return; }
  } else if(!$("view-cases").hidden){
    const fwd=lang==="ar"?"ArrowLeft":"ArrowRight", back=lang==="ar"?"ArrowRight":"ArrowLeft";
    if(e.key===fwd&&CI<CASES.length-1){ e.preventDefault(); CI++; renderCase(); return; }
    if(e.key===back&&CI>0){ e.preventDefault(); CI--; renderCase(); return; }
    if(/^[1-4]$/.test(e.key)&&CANS[CI]==null){ const ord=caseOrder(CI); if(+e.key<=ord.length){ CANS[CI]=ord[+e.key-1]; renderCase(); } return; }
  }
  if(e.key==="f"||e.key==="F"){ if(FS_OK){ e.preventDefault(); toggleFS(); } return; }
  if(e.key==="s"||e.key==="S"){ e.preventDefault(); saveOffline(); return; }
  if(e.key==="m"||e.key==="M"){ e.preventDefault(); toggleSound(); return; }
  if(e.key==="l"||e.key==="L"){ e.preventDefault(); $("langbtn").click(); return; }
});
let rzT=null; window.addEventListener("resize",()=>{clearTimeout(rzT); rzT=setTimeout(()=>renderField(false),150);});
VOICE_ON=SOUND;
drawField(); renderNames(); PLAN=planFor(0); rebuild(false); render(false); renderCase(); renderPen();
requestAnimationFrame(()=>requestAnimationFrame(()=>{for(const k in TOK) TOK[k].style.transition="";}));
})();
</script>
